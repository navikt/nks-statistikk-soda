apiVersion: nais.io/v1
kind: Naisjob
metadata:
  labels:
    team: nks-statistikk
  name: nks-statistikk-soda-contracts
  namespace: nks-statistikk
spec:
  image: europe-north1-docker.pkg.dev/nais-management-233d/nada/nada-soda-contracts:2026.06.26-08.53-e2166bc
  accessPolicy:
    outbound:
      rules:
        - application: nada-soda
          namespace: nada
  env:
    - name: SODA_CONFIG
      value: /var/run/configmaps/soda-config-contracts/config.yaml
    - name: SODA_CHECKS_FOLDER
      value: /var/run/configmaps/soda-checks-contracts
    - name: SLACK_CHANNEL
      value: "#team-nks-brukerinnsikt-data-alerts"
  timeZone: Europe/Oslo
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  backoffLimit: 1
  concurrencyPolicy: Forbid
  filesFrom:
    - configmap: soda-checks-contracts
    - configmap: soda-config-contracts
  gcp:
    permissions:
    - resource:
        apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
        kind: Project
        name: nks-statistikk-prod-80c9
      role: roles/bigquery.dataViewer
    - resource:
        apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
        kind: Project
        name: nks-statistikk-prod-80c9
      role: roles/bigquery.jobUser
