apiVersion: v1
kind: ConfigMap
metadata:
  name: soda-checks-contracts
  namespace: nks-statistikk
data:
  oppgavestatistikk__nks_oppgave_dag_hist.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/oppgavestatistikk/nks_oppgave_dag_hist

    filter: "dato = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)"

    checks:
      - row_count:
          name: "Sjekker om gårsdagens data er på plass"
          threshold:
            must_be_greater_than: 0

    columns: []

  oppgavestatistikk__innsyn_oppgave_dag_hist.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/oppgavestatistikk/innsyn_oppgave_dag_hist

    filter: "dato = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)"

    checks:
      - row_count:
          name: "Sjekker om gårsdagens data er på plass"
          threshold:
            must_be_greater_than: 0

    columns: []
  
  boost_data__boost_chat_hour_raw.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/boost_data/boost_chat_hour_raw

    checks:
      - metric:
          name: "Sjekker om gårsdagens data er på plass"
          query: |
            SELECT IF(COUNT(1) > 0, 1, 0)
            FROM boost_data.boost_chat_hour_raw
            WHERE DATE(period) = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          threshold:
            must_be_greater_than: 0

    columns:
      - name: period
        checks:
          - duplicate:
              name: "Sjekker om tabellen inneholder duplikater"

  boost_data__boost_chat_human_transfer_day_raw.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/boost_data/boost_chat_human_transfer_day_raw

    checks:
      - metric:
          name: "Sjekker om gårsdagens data er på plass"
          query: |
            SELECT IF(COUNT(1) > 0, 1, 0)
            FROM boost_data.boost_chat_human_transfer_day_raw
            WHERE period = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          threshold:
            must_be_greater_than: 0
      - duplicate:
          name: "Sjekker om tabellen inneholder duplikater"
          columns: ['period', 'transferred_to_human']

    columns: []
  
  boost_data__boost_chat_intents_day_raw.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/boost_data/boost_chat_intents_day_raw

    checks:
      - metric:
          name: "Sjekker om gårsdagens data er på plass"
          qualifier: c1
          query: |
            SELECT IF(COUNT(1) > 0, 1, 0)
            FROM boost_data.boost_chat_intents_day_raw
            WHERE period = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
          threshold:
            must_be_greater_than: 0
      - metric:
          name: "Sjekker om det er mange manglende root intents"
          qualifier: c2
          query: |
            SELECT COUNT(*)
            FROM boost_data.boost_chat_intents_day_raw i
            LEFT JOIN boost_data.root_intent_mapping r
            ON i.intent_title = r.intent
            WHERE period = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
            AND r.root_intent IS NULL
          threshold:
            must_be_less_than: 5
      - duplicate:
          name: "Sjekker om tabellen inneholder duplikater"
          columns: ['period', 'id']

    columns: []

  sf_chat_data__messaging_session.yaml: |
    dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/sf_chat_data/messaging_session

    checks:
      - metric:
          name: "Sjekk om data fra forrige virkedag eksisterer"
          query: |
            WITH date_to_check AS (
              SELECT DATE(MAX(dato)) AS check_date
              FROM felles_kodeverk.dim_tid
              WHERE virkedag_flagg = 1
              AND dato < CURRENT_DATE()
