dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/sf_sto_data/case_milestone

checks:
  - metric:
      name: "Sjekker om gårsdagens data er på plass"
      query: |
        SELECT IF(COUNT(1) > 0, 1, 0)
        FROM sf_sto_data.case_milestone
        WHERE DATE(start_date) = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
      threshold:
        must_be_greater_than: 0

columns:
  - name: id
    checks:
      - duplicate:
          name: "Sjekker om tabellen inneholder duplikater"