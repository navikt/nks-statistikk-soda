dataset: nks-statistikk-bigquery/nks-statistikk-prod-80c9/sf_kunnskapsbase/artikkelvisninger_daglig_snapshot

checks:
  - metric:
      name: "Sjekker om gårsdagens data er på plass"
      query: |
        SELECT IF(COUNT(1) > 0, 1, 0)
        FROM sf_kunnskapsbase.artikkelvisninger_daglig_snapshot
        WHERE Date = DATE_SUB(CURRENT_DATE(), INTERVAL 1 DAY)
      threshold:
        must_be_greater_than: 0
  - duplicate:
      name: "Sjekker om tabellen inneholder duplikater"
      columns: ['KnowledgeArticleId', 'Date']

columns: []